<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Distant City Skyline Silhouettes -->
  <g fill="#070a14" opacity="0.95">
    <rect x="80" y="220" width="70" height="230" />
    <rect x="170" y="160" width="90" height="290" />
    <rect x="280" y="240" width="60" height="210" />
    <rect x="360" y="190" width="80" height="260" />
    <!-- KICC Silhouette Tower -->
    <path d="M 600,100 L 620,180 L 640,180 L 640,450 L 560,450 L 560,180 L 580,180 Z" />
    <ellipse cx="600" cy="180" rx="45" ry="12" fill="#0c1020" />
    <rect x="740" y="210" width="75" height="240" />
    <rect x="835" y="150" width="95" height="300" />
    <rect x="950" y="230" width="70" height="220" />
    <rect x="1040" y="180" width="90" height="270" />
  </g>

  <!-- Highway Road Ground -->
  <path d="M 0,450 L 1200,450 L 1200,630 L 0,630 Z" fill="#111520" />
  <!-- Highway Yellow & White Lanes -->
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#f59e0b" stroke-width="6" stroke-dasharray="30 20" />
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#38bdf8" stroke-width="4" stroke-dasharray="20 15" opacity="0.6" />
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#38bdf8" stroke-width="4" stroke-dasharray="20 15" opacity="0.6" />

  <!-- Glowing Underglow Beams -->
  <ellipse cx="600" cy="460" rx="350" ry="25" fill="#ec4899" opacity="0.45" filter="url(#glow)" />
  <ellipse cx="600" cy="460" rx="200" ry="12" fill="#00f0ff" opacity="0.6" filter="url(#glow)" />

  <!-- Badge Top -->
  <rect x="430" y="90" width="340" height="42" rx="21" fill="#111827" stroke="#f59e0b" stroke-width="2" />
  <text x="600" y="117" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#ffd166" text-anchor="middle" letter-spacing="2">
    🇰🇪 NAIROBI TRAFFIC DODGER • 3D WEB GAME
  </text>

  <!-- Big Bold Title -->
  <text x="600" y="260" font-family="'Bungee', 'Impact', sans-serif" font-size="108" fill="#ffffff" text-anchor="middle" filter="url(#glow)" letter-spacing="4">
    NGANYA
  </text>
  <text x="600" y="370" font-family="'Bungee', 'Impact', sans-serif" font-size="104" fill="url(#neon)" text-anchor="middle" filter="url(#glow)" letter-spacing="4">
    SURFERS
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="425" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">
    Dodge Speeding Matatus • Roof Surfing • Boda-Boda Rides • Instant Play
  </text>

  <!-- Call to action button pill -->
  <rect x="460" y="475" width="280" height="60" rx="30" fill="#00f0ff" />
  <text x="600" y="513" font-family="'Bungee', sans-serif" font-size="20" fill="#090d16" text-anchor="middle" letter-spacing="1">
    ▶ PLAY FREE NOW
  </text>

  <!-- Domain water mark -->
  <text x="600" y="585" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    nganyarunner.humblesherrif.online
  </text>
</svg>
